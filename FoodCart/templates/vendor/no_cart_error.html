{% extends 'core/base.html' %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-5 text-center" style="max-width: 500px; border-radius: 20px; border: none;">
        
        <div class="mb-4 text-warning animate__animated animate__bounceIn">
            <i class="fas fa-store-slash fa-6x"></i>
        </div>

        <h2 class="fw-bold mb-3">No Active Food Cart</h2>
        <p class="text-muted lead mb-4">
            Welcome back, <strong>{{ user.username }}</strong>! <br>
            It looks like your food cart profile was deleted, so there is nothing to manage here.
        </p>

        <div class="d-grid gap-3">
            <p class="small text-muted mb-0">To start fresh, please logout first.</p>
            
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-dark btn-lg w-100 rounded-pill shadow-sm">
                    <i class="fas fa-sign-out-alt me-2"></i> Logout
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
