{% extends 'core/base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark">
                <h4 class="mb-0"><i class="fas fa-edit me-2"></i>Edit Item: {{ item.name }}</h4>
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="fw-bold small">Item Name</label>
                        {{ form.name }}
                    </div>
                    
                    <div class="row">
                        <div class="col-6 mb-3">
                            <label class="fw-bold small">Price</label>
                            {{ form.price }}
                        </div>
                        <div class="col-6 mb-3">
                            <label class="fw-bold small">Stock</label>
                            {{ form.stock_qty }}
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="fw-bold small">Change Photo</label>
                        {{ form.image }}
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark flex-grow-1">Save Changes</button>
                        <a href="{% url 'manage_menu' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Auto-style form
    document.querySelectorAll('input').forEach(field => {
        field.classList.add('form-control');
        field.style.padding = "10px";
    });
</script>
{% endblock %}
